<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>对话</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f7f6f3;
    --surface: #ffffff;
    --border: #e2e0db;
    --border-light: #eeede9;
    --text: #1c1b19;
    --text-muted: #888580;
    --text-faint: #b8b5b0;
    --accent: #3d3b38;
    --user-bg: #1c1b19;
    --user-text: #f7f6f3;
    --tag-claude: #6b7a8d;
    --tag-gpt: #5a7a5a;
    --tag-gemini: #8d6b6b;
    --radius: 16px;
    --radius-sm: 10px;
    --input-height: 52px;
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "PingFang SC", "Hiragino Sans GB", sans-serif;
    font-size: 15px;
    line-height: 1.6;
    overscroll-behavior: none;
  }

  /* ── Layout ── */
  #app {
    display: flex;
    flex-direction: column;
    height: 100dvh;
    max-width: 720px;
    margin: 0 auto;
    position: relative;
  }

  /* ── Header ── */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 18px 12px;
    border-bottom: 1px solid var(--border-light);
    background: var(--bg);
    position: sticky;
    top: 0;
    z-index: 10;
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
  }

  .header-title {
    font-family: 'Cormorant', serif;
    font-size: 22px;
    font-weight: 300;
    letter-spacing: 0.04em;
    color: var(--text);
  }

  .model-badge {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 5px 11px;
    border-radius: 20px;
    border: 1px solid var(--border);
    background: var(--surface);
    cursor: pointer;
    font-size: 12px;
    color: var(--text-muted);
    letter-spacing: 0.02em;
    transition: all 0.15s;
    user-select: none;
  }
  .model-badge:active { opacity: 0.7; }
  .model-badge .dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--text-faint);
    flex-shrink: 0;
  }
  .model-badge.provider-claude .dot { background: var(--tag-claude); }
  .model-badge.provider-gpt .dot { background: var(--tag-gpt); }
  .model-badge.provider-gemini .dot { background: var(--tag-gemini); }

  .settings-btn {
    width: 36px; height: 36px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: var(--surface);
    cursor: pointer;
    color: var(--text-muted);
    transition: all 0.15s;
    flex-shrink: 0;
  }
  .settings-btn:active { opacity: 0.6; }

  /* ── Messages ── */
  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px 16px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    -webkit-overflow-scrolling: touch;
  }

  .msg {
    display: flex;
    flex-direction: column;
    max-width: 85%;
    animation: msgIn 0.2s ease;
  }
  @keyframes msgIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .msg.user { align-self: flex-end; align-items: flex-end; }
  .msg.assistant { align-self: flex-start; align-items: flex-start; }

  .bubble {
    padding: 11px 15px;
    border-radius: var(--radius);
    line-height: 1.65;
    word-break: break-word;
    white-space: pre-wrap;
  }

  .msg.user .bubble {
    background: var(--user-bg);
    color: var(--user-text);
    border-bottom-right-radius: 4px;
  }

  .msg.assistant .bubble {
    background: var(--surface);
    border: 1px solid var(--border-light);
    border-bottom-left-radius: 4px;
    color: var(--text);
  }

  .msg-meta {
    font-size: 11px;
    color: var(--text-faint);
    margin-top: 4px;
    padding: 0 4px;
    letter-spacing: 0.02em;
  }

  .typing {
    display: flex; align-items: center; gap: 4px;
    padding: 14px 16px;
  }
  .typing span {
    width: 5px; height: 5px;
    border-radius: 50%;
    background: var(--text-faint);
    animation: bounce 1.2s infinite;
  }
  .typing span:nth-child(2) { animation-delay: 0.2s; }
  .typing span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes bounce {
    0%, 80%, 100% { transform: translateY(0); opacity: 0.4; }
    40% { transform: translateY(-5px); opacity: 1; }
  }

  /* ── Empty state ── */
  #empty {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
    color: var(--text-faint);
    pointer-events: none;
    user-select: none;
    padding-bottom: 60px;
  }
  #empty .big { font-family: 'Cormorant', serif; font-size: 42px; font-weight: 300; line-height: 1; }
  #empty .sub { font-size: 13px; letter-spacing: 0.04em; }

  /* ── Input area ── */
  #input-area {
    padding: 12px 14px;
    padding-bottom: calc(12px + var(--safe-bottom));
    border-top: 1px solid var(--border-light);
    background: var(--bg);
  }

  .input-row {
    display: flex;
    align-items: flex-end;
    gap: 10px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 24px;
    padding: 8px 8px 8px 16px;
    transition: border-color 0.2s;
  }
  .input-row:focus-within { border-color: var(--accent); }

  #input {
    flex: 1;
    border: none;
    outline: none;
    background: transparent;
    font-size: 15px;
    font-family: inherit;
    color: var(--text);
    resize: none;
    max-height: 120px;
    min-height: 24px;
    line-height: 1.5;
    padding: 3px 0;
  }
  #input::placeholder { color: var(--text-faint); }

  #send-btn {
    width: 36px; height: 36px;
    flex-shrink: 0;
    border-radius: 50%;
    border: none;
    background: var(--user-bg);
    color: var(--user-text);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.15s;
    opacity: 0.35;
  }
  #send-btn.active { opacity: 1; }
  #send-btn:active { transform: scale(0.92); }

  /* ── Settings panel ── */
  #settings-overlay {
    position: fixed; inset: 0;
    background: rgba(28,27,25,0.45);
    z-index: 100;
    display: none;
    align-items: flex-end;
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
  }
  #settings-overlay.open { display: flex; }

  #settings-panel {
    width: 100%;
    max-width: 720px;
    margin: 0 auto;
    background: var(--surface);
    border-radius: 24px 24px 0 0;
    padding: 24px 22px;
    padding-bottom: calc(24px + var(--safe-bottom));
    animation: slideUp 0.28s cubic-bezier(.32,.72,0,1);
  }
  @keyframes slideUp {
    from { transform: translateY(100%); }
    to { transform: translateY(0); }
  }

  .panel-handle {
    width: 36px; height: 4px;
    background: var(--border);
    border-radius: 2px;
    margin: 0 auto 22px;
  }

  .panel-title {
    font-family: 'Cormorant', serif;
    font-size: 20px;
    font-weight: 300;
    margin-bottom: 20px;
    color: var(--text);
  }

  .field-group { margin-bottom: 18px; }
  .field-label {
    font-size: 12px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--text-faint);
    margin-bottom: 8px;
    display: block;
  }

  .field-input {
    width: 100%;
    padding: 11px 14px;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    background: var(--bg);
    font-size: 14px;
    font-family: monospace;
    color: var(--text);
    outline: none;
    transition: border-color 0.2s;
  }
  .field-input:focus { border-color: var(--accent); }

  .model-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }

  .model-option {
    padding: 10px 13px;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    cursor: pointer;
    background: var(--bg);
    transition: all 0.15s;
    user-select: none;
  }
  .model-option:active { opacity: 0.7; }
  .model-option.selected {
    border-color: var(--accent);
    background: var(--accent);
    color: var(--user-text);
  }
  .model-option .m-name { font-size: 13px; font-weight: 500; }
  .model-option .m-sub { font-size: 11px; opacity: 0.6; margin-top: 2px; }

  .save-btn {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: var(--radius-sm);
    background: var(--user-bg);
    color: var(--user-text);
    font-size: 15px;
    font-family: inherit;
    cursor: pointer;
    margin-top: 6px;
    letter-spacing: 0.02em;
    transition: opacity 0.15s;
  }
  .save-btn:active { opacity: 0.7; }

  .error-msg {
    background: #fff0f0;
    border: 1px solid #f0d0d0;
    color: #c04040;
    padding: 10px 14px;
    border-radius: var(--radius-sm);
    font-size: 13px;
    margin-top: 6px;
  }

  /* scrollbar */
  #messages::-webkit-scrollbar { width: 0; }
</style>
</head>
<body>
<div id="app">
  <header>
    <span class="header-title">对话</span>
    <div class="model-badge" id="model-badge" onclick="openSettings()">
      <span class="dot"></span>
      <span id="badge-text">未配置</span>
    </div>
    <button class="settings-btn" onclick="openSettings()" aria-label="设置">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <circle cx="12" cy="12" r="3"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
      </svg>
    </button>
  </header>

  <div id="messages">
    <div id="empty">
      <div class="big">∿</div>
      <div class="sub">先在设置里填入 API Key</div>
    </div>
  </div>

  <div id="input-area">
    <div class="input-row">
      <textarea id="input" rows="1" placeholder="说点什么…" disabled></textarea>
      <button id="send-btn" onclick="sendMessage()" aria-label="发送">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
          <line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/>
        </svg>
      </button>
    </div>
  </div>
</div>

<!-- Settings -->
<div id="settings-overlay" onclick="overlayClick(event)">
  <div id="settings-panel">
    <div class="panel-handle"></div>
    <div class="panel-title">配置</div>

    <div class="field-group">
      <label class="field-label">选择模型</label>
      <div class="model-grid" id="model-grid">
        <div class="model-option" data-id="claude-sonnet-4-20250514" data-provider="claude" onclick="selectModel(this)">
          <div class="m-name">Claude Sonnet 4</div>
          <div class="m-sub">Anthropic</div>
        </div>
        <div class="model-option" data-id="claude-opus-4-20250514" data-provider="claude" onclick="selectModel(this)">
          <div class="m-name">Claude Opus 4</div>
          <div class="m-sub">Anthropic</div>
        </div>
        <div class="model-option" data-id="gpt-4o" data-provider="gpt" onclick="selectModel(this)">
          <div class="m-name">GPT-4o</div>
          <div class="m-sub">OpenAI</div>
        </div>
        <div class="model-option" data-id="gpt-4o-mini" data-provider="gpt" onclick="selectModel(this)">
          <div class="m-name">GPT-4o mini</div>
          <div class="m-sub">OpenAI</div>
        </div>
        <div class="model-option" data-id="gemini-2.0-flash-lite" data-provider="gemini" onclick="selectModel(this)">
          <div class="m-name">Gemini 2.0 Flash Lite</div>
          <div class="m-sub">Google</div>
        </div>
        <div class="model-option" data-id="gemini-1.5-pro-latest" data-provider="gemini" onclick="selectModel(this)">
          <div class="m-name">Gemini 1.5 Pro</div>
          <div class="m-sub">Google</div>
        </div>
      </div>
    </div>

    <div class="field-group" id="key-claude-group">
      <label class="field-label">Anthropic API Key</label>
      <input class="field-input" id="key-claude" type="password" placeholder="sk-ant-…">
    </div>
    <div class="field-group" id="key-gpt-group" style="display:none">
      <label class="field-label">OpenAI API Key</label>
      <input class="field-input" id="key-gpt" type="password" placeholder="sk-…">
    </div>
    <div class="field-group" id="key-gemini-group" style="display:none">
      <label class="field-label">Google API Key</label>
      <input class="field-input" id="key-gemini" type="password" placeholder="AIza…">
    </div>

    <div id="settings-error"></div>
    <button class="save-btn" onclick="saveSettings()">保存并开始</button>
  </div>
</div>

<script>
const state = {
  model: null,
  provider: null,
  keys: { claude: '', gpt: '', gemini: '' },
  history: [],
  loading: false,
};

// ── Init ──
function init() {
  const saved = localStorage.getItem('chat-config');
  if (saved) {
    const c = JSON.parse(saved);
    state.model = c.model;
    state.provider = c.provider;
    state.keys = { ...state.keys, ...c.keys };
    updateBadge();
    enableInput();
    document.getElementById('empty').querySelector('.sub').textContent = '开始对话吧';
  }
  const inp = document.getElementById('input');
  inp.addEventListener('input', () => {
    inp.style.height = 'auto';
    inp.style.height = Math.min(inp.scrollHeight, 120) + 'px';
    document.getElementById('send-btn').classList.toggle('active', inp.value.trim().length > 0);
  });
  inp.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
  });
}

// ── Settings ──
function openSettings() {
  document.getElementById('settings-overlay').classList.add('open');
  // restore selections
  if (state.model) {
    document.querySelectorAll('.model-option').forEach(el => {
      el.classList.toggle('selected', el.dataset.id === state.model);
    });
    showKeyGroup(state.provider);
  }
  if (state.keys.claude) document.getElementById('key-claude').value = state.keys.claude;
  if (state.keys.gpt) document.getElementById('key-gpt').value = state.keys.gpt;
  if (state.keys.gemini) document.getElementById('key-gemini').value = state.keys.gemini;
}

function closeSettings() {
  document.getElementById('settings-overlay').classList.remove('open');
  document.getElementById('settings-error').innerHTML = '';
}

function overlayClick(e) {
  if (e.target === document.getElementById('settings-overlay')) closeSettings();
}

function selectModel(el) {
  document.querySelectorAll('.model-option').forEach(o => o.classList.remove('selected'));
  el.classList.add('selected');
  showKeyGroup(el.dataset.provider);
}

function showKeyGroup(provider) {
  ['claude','gpt','gemini'].forEach(p => {
    document.getElementById('key-' + p + '-group').style.display = p === provider ? '' : 'none';
  });
}

function saveSettings() {
  const selected = document.querySelector('.model-option.selected');
  if (!selected) { showError('请选择一个模型'); return; }
  const provider = selected.dataset.provider;
  const key = document.getElementById('key-' + provider).value.trim();
  if (!key) { showError('请填入对应的 API Key'); return; }

  state.model = selected.dataset.id;
  state.provider = provider;
  state.keys[provider] = key;

  localStorage.setItem('chat-config', JSON.stringify({
    model: state.model, provider: state.provider, keys: state.keys
  }));

  updateBadge();
  enableInput();
  document.getElementById('empty').querySelector('.sub').textContent = '开始对话吧';
  closeSettings();
}

function showError(msg) {
  document.getElementById('settings-error').innerHTML = '<div class="error-msg">' + msg + '</div>';
}

function updateBadge() {
  const badge = document.getElementById('model-badge');
  const names = {
    'claude-sonnet-4-20250514': 'Sonnet 4',
    'claude-opus-4-20250514': 'Opus 4',
    'gpt-4o': 'GPT-4o',
    'gpt-4o-mini': '4o mini',
    'gemini-2.0-flash-lite': 'Flash Lite',
    'gemini-1.5-pro-latest': 'Gemini Pro',
  };
  document.getElementById('badge-text').textContent = names[state.model] || state.model;
  badge.className = 'model-badge provider-' + state.provider;
}

function enableInput() {
  const inp = document.getElementById('input');
  inp.disabled = false;
  inp.placeholder = '说点什么…';
}

// ── Chat ──
async function sendMessage() {
  if (state.loading) return;
  const inp = document.getElementById('input');
  const text = inp.value.trim();
  if (!text || !state.model) return;

  appendMsg('user', text);
  state.history.push({ role: 'user', content: text });
  inp.value = '';
  inp.style.height = 'auto';
  document.getElementById('send-btn').classList.remove('active');
  hideEmpty();

  state.loading = true;
  const typingEl = showTyping();

  try {
    let reply = '';
    if (state.provider === 'claude') reply = await callClaude();
    else if (state.provider === 'gpt') reply = await callGPT();
    else if (state.provider === 'gemini') reply = await callGemini();

    typingEl.remove();
    appendMsg('assistant', reply, state.model);
    state.history.push({ role: 'assistant', content: reply });
  } catch (e) {
    typingEl.remove();
    appendMsg('assistant', '⚠ ' + (e.message || '请求失败，请检查 API Key 或网络'));
  }
  state.loading = false;
}

async function callClaude() {
  const res = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: {
      'x-api-key': state.keys.claude,
      'anthropic-version': '2023-06-01',
      'content-type': 'application/json',
      'anthropic-dangerous-direct-browser-access': 'true',
    },
    body: JSON.stringify({
      model: state.model,
      max_tokens: 2048,
      messages: state.history,
    }),
  });
  if (!res.ok) {
    const e = await res.json().catch(() => ({}));
    throw new Error(e.error?.message || `HTTP ${res.status}`);
  }
  const d = await res.json();
  return d.content?.[0]?.text || '';
}

async function callGPT() {
  const res = await fetch('https://api.openai.com/v1/chat/completions', {
    method: 'POST',
    headers: {
      'Authorization': 'Bearer ' + state.keys.gpt,
      'content-type': 'application/json',
    },
    body: JSON.stringify({
      model: state.model,
      messages: state.history,
    }),
  });
  if (!res.ok) {
    const e = await res.json().catch(() => ({}));
    throw new Error(e.error?.message || `HTTP ${res.status}`);
  }
  const d = await res.json();
  return d.choices?.[0]?.message?.content || '';
}

async function callGemini() {
  // Convert history to Gemini format
  const contents = state.history.map(m => ({
    role: m.role === 'assistant' ? 'model' : 'user',
    parts: [{ text: m.content }],
  }));
  const res = await fetch(
    `https://generativelanguage.googleapis.com/v1beta/models/${state.model}:generateContent?key=${state.keys.gemini}`,
    {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ contents }),
    }
  );
  if (!res.ok) {
    const e = await res.json().catch(() => ({}));
    throw new Error(e.error?.message || `HTTP ${res.status}`);
  }
  const d = await res.json();
  return d.candidates?.[0]?.content?.parts?.[0]?.text || '';
}

// ── UI helpers ──
function appendMsg(role, text, model) {
  const wrap = document.getElementById('messages');
  const el = document.createElement('div');
  el.className = 'msg ' + role;

  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.textContent = text;
  el.appendChild(bubble);

  if (role === 'assistant' && model) {
    const meta = document.createElement('div');
    meta.className = 'msg-meta';
    meta.textContent = model;
    el.appendChild(meta);
  }

  wrap.appendChild(el);
  wrap.scrollTop = wrap.scrollHeight;
}

function showTyping() {
  const wrap = document.getElementById('messages');
  const el = document.createElement('div');
  el.className = 'msg assistant';
  el.innerHTML = '<div class="bubble typing"><span></span><span></span><span></span></div>';
  wrap.appendChild(el);
  wrap.scrollTop = wrap.scrollHeight;
  return el;
}

function hideEmpty() {
  const e = document.getElementById('empty');
  if (e) e.style.display = 'none';
}

init();
</script>
</body>
</html>
